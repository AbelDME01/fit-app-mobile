<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>FitPro</title>
  <base href="/" />

  <!-- Security Headers -->
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta http-equiv="X-Frame-Options" content="DENY" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />

  <!-- Content Security Policy -->
  <!-- Note: CSP should ideally be set via HTTP headers, but this provides fallback -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline' 'unsafe-eval';
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src 'self' https://fonts.gstatic.com;
    img-src 'self' data: https: blob:;
    connect-src 'self' https://gqtxjstuvpqfmbjvbaay.supabase.co https://*.supabase.co http://localhost:* ws://localhost:*;
    frame-ancestors 'none';
    base-uri 'self';
    form-action 'self';
  " />

  <!-- App Configuration -->
  <meta name="color-scheme" content="dark" />
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />
  <meta name="theme-color" content="#0D0D0D" />

  <!-- Prevent Search Engine Indexing (Development) -->
  <meta name="robots" content="noindex, nofollow" />

  <!-- Icons -->
  <link rel="icon" type="image/png" href="assets/icon/favicon.png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>
  <app-root></app-root>
</body>
</html>
